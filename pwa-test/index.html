<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b52b86">
  <meta name="description" content="MuffinFlow — pintasan aplikasi Redaksi dan Promosi Muffin Graphics">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>MuffinFlow — Membuka Aplikasi</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#41263f;background:#fff6fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 25%,#f9dceb 0,#fff6fa 65%)}
    main{width:min(100%,380px);text-align:center;background:white;border:1px solid #efcee1;border-radius:24px;padding:29px 24px;box-shadow:0 14px 36px #b52b8614}
    img{display:block;width:100px;height:100px;margin:0 auto 12px}
    h1{font-size:26px;line-height:1.2;margin:0 0 4px}
    p{color:#765a71;font-size:14px;line-height:1.55;margin:8px 0 18px}
    a{display:block;text-decoration:none;border-radius:11px;background:#b52b86;color:white;padding:13px 17px;font-weight:750;font-size:14px}
    small{display:block;font-size:12px;line-height:1.55;color:#86677e;margin-top:14px}
  </style>
</head>
<body>
  <main>
    <img src="./icon-192.png" alt="Logo Muffin Graphics">
    <h1>MuffinFlow</h1>
    <p id="status">Membuka aplikasi Redaksi &amp; Promosi...</p>
    <a id="openApp" href="https://muffingraphics-alt.github.io/progress-buku/app/">Buka MuffinFlow</a>
    <small>MuffinFlow tetap berjalan melalui Google Apps Script. Kode akses tim tidak berubah.</small>
  </main>
  <script>
    const target=document.getElementById('openApp').href;
    if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
    // Launcher: keep the original GitHub Pages redirect and existing account setup.
    window.setTimeout(()=>window.location.replace(target),950);
  </script>
</body>
</html>
